version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sofalabet-postgres
    restart: always
    environment:
      POSTGRES_USER: sofalabet_user
      POSTGRES_PASSWORD: sofalabet_password_secure
      POSTGRES_DB: sofalabet_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sofalabet_user -d sofalabet_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: sofalabet-backend
    restart: always
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: "postgresql://sofalabet_user:sofalabet_password_secure@postgres:5432/sofalabet_db?schema=public"
      JWT_SECRET: "sofalabet_production_super_secret_jwt_key_2026"
      MINIMUM_STAKE: "10"
      MAXIMUM_STAKE: "50000"
      MAXIMUM_POTENTIAL_WIN: "1000000"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
